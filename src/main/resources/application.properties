# Credentials come from environment variables; nothing secret is stored in this file.
# DB_USERNAME, DB_PASSWORD (default to root/root for a local MySQL)
# RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET (from the Razorpay dashboard)
spring.application.name=Payment_Gateway_App
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
server.port=9090
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

#logging.level.org.springframework.web=DEBUG
#logging.level.org.hibernate=DEBUG
